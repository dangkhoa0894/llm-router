services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-llm_router}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-llm_router}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Points at the `postgres` service by container name — deliberately NOT
      # .env's DATABASE_URL, which targets localhost for host-side Prisma CLI.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-llm_router}?schema=public
      ROUTER_ADMIN_TOKEN: ${ROUTER_ADMIN_TOKEN:-}
      ROUTER_SIGNUP_ENABLED: ${ROUTER_SIGNUP_ENABLED:-false}
      ROUTER_SIGNUP_CREDIT_USD: ${ROUTER_SIGNUP_CREDIT_USD:-0}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-}
      VIETQR_BANK_NAME: ${VIETQR_BANK_NAME:-}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
      VIETQR_VND_PER_USD: ${VIETQR_VND_PER_USD:-26000}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      # Upstream provider keys — add one line per provider you register.
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
